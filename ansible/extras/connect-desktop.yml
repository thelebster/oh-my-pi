---
# Raspberry Pi Connect for Pi OS Desktop (remote shell + screen sharing).
# Set RPI_CONNECT_AUTH_KEY in .env for non-interactive sign-in.
#
# Usage:
#   ./play extra connect-desktop --limit mypi
#
- name: Install Raspberry Pi Connect (desktop)
  hosts: all
  become: true

  tasks:
    - name: Remove rpi-connect-lite if installed
      apt:
        name: rpi-connect-lite
        state: absent

    - name: Install rpi-connect
      apt:
        name: rpi-connect
        state: present

    - name: Enable and sign in
      include_tasks: tasks/rpi-connect-signin.yml
