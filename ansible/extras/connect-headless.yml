---
# Raspberry Pi Connect for Pi OS Lite (remote shell only, no screen sharing).
# Set RPI_CONNECT_AUTH_KEY in .env for non-interactive sign-in.
#
# Usage:
#   ./play extra connect-headless --limit mypi
#
- name: Install Raspberry Pi Connect (headless)
  hosts: all
  become: true

  tasks:
    - name: Remove rpi-connect if installed
      apt:
        name: rpi-connect
        state: absent

    - name: Install rpi-connect-lite
      apt:
        name: rpi-connect-lite
        state: present

    - name: Enable and sign in
      include_tasks: tasks/rpi-connect-signin.yml
