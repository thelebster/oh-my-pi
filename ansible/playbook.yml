---
# =============================================
# BASE SETUP (all Pis)
# =============================================
# Minimal, safe-to-rerun base. Everything else lives in ansible/extras/.
#
# Usage:
#   ./play                    # all hosts
#   ./play --limit mypi       # single host
#   ./play --check            # dry run
#   ./play --tags ssh         # one section
#
# Tags: updates, ssh, fan, eeprom
- name: Base Pi setup
  hosts: all
  become: true

  tasks:
    # === UPDATES ===
    - name: Update and upgrade packages
      apt:
        update_cache: true
        upgrade: dist
      tags: updates

    - name: Install essentials
      apt:
        name: [curl, git, vim, htop, ufw, pv, jq, mc]
        state: present
      tags: updates

    - name: Allow SSH, HTTP and HTTPS through the firewall
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: ["22", "80", "443"]
      tags: updates

    - name: Enable UFW
      ufw:
        state: enabled
      tags: updates

    # === SUDO ===
    # raspberrypi-sys-mods upgrades can drop the stock NOPASSWD rule, which locks Ansible out.
    - name: Ensure passwordless sudo for the Ansible user
      copy:
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/010_pi-nopasswd
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s
      tags: [updates, sudo]

    # === SSH HARDENING ===
    - name: Disable SSH password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH
      tags: ssh

    - name: Disable SSH root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH
      tags: ssh

    - name: Install fail2ban
      apt:
        name: fail2ban
        state: present
      tags: ssh

    - name: Configure fail2ban SSH jail
      copy:
        content: |
          [sshd]
          enabled = true
          port = ssh
          maxretry = 5
          bantime = 3600
          findtime = 600
        dest: /etc/fail2ban/jail.d/ssh.conf
        mode: "0644"
      notify: Restart fail2ban
      tags: ssh

    - name: Enable fail2ban
      systemd:
        name: fail2ban
        enabled: true
        state: started
      tags: ssh

    # === PI 5 ONLY: FAN + EEPROM ===
    - name: Check Pi model
      command: cat /proc/device-tree/model
      register: pi_model
      changed_when: false
      failed_when: false
      tags: [fan, eeprom]

    - name: Configure fan temperature thresholds
      blockinfile:
        path: /boot/firmware/config.txt
        marker: "# {mark} ANSIBLE MANAGED - FAN CONFIG"
        block: |
          dtparam=fan_temp0=40000
          dtparam=fan_temp0_hyst=5000
          dtparam=fan_temp0_speed=75
          dtparam=fan_temp1=55000
          dtparam=fan_temp1_hyst=5000
          dtparam=fan_temp1_speed=125
          dtparam=fan_temp2=65000
          dtparam=fan_temp2_hyst=5000
          dtparam=fan_temp2_speed=175
          dtparam=fan_temp3=75000
          dtparam=fan_temp3_hyst=5000
          dtparam=fan_temp3_speed=250
      when: "'Raspberry Pi 5' in pi_model.stdout"
      notify: Reboot required
      tags: fan

    - name: Check EEPROM update status
      command: rpi-eeprom-update
      register: eeprom_check
      changed_when: false
      failed_when: false
      when: "'Raspberry Pi 5' in pi_model.stdout"
      tags: eeprom

    - name: Apply EEPROM update if available
      command: rpi-eeprom-update -a
      when:
        - "'Raspberry Pi 5' in pi_model.stdout"
        - "'UPDATE AVAILABLE' in eeprom_check.stdout | default('')"
      notify: Reboot required
      tags: eeprom

  handlers:
    - name: Reboot required
      debug:
        msg: "Reboot required to apply changes (fan config or EEPROM firmware)"

    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      systemd:
        name: fail2ban
        state: restarted
